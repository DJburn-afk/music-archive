<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>뮤직 아카이브 by DJ BURN</title>

<style>
body { background:#111; color:white; font-family:sans-serif; padding:30px; }
.container { max-width:1200px; margin:auto; }
h1 { font-size:42px; margin-bottom:10px; }
.sub { color:#aaa; margin-bottom:25px; }

.layout { display:grid; grid-template-columns:350px 1fr; gap:20px; }
.card { background:#1d1d1d; padding:20px; border-radius:20px; border:1px solid #333; }

input, textarea {
width:100%; padding:12px; margin-bottom:10px;
background:#2a2a2a; color:white; border:1px solid #444; border-radius:12px;
}

button {
padding:12px; border:none; border-radius:12px; cursor:pointer; font-weight:bold;
}

.save-btn { width:100%; background:white; color:black; }

.secondary { background:#444; color:white; }

.delete-btn { background:#5f2222; color:#ffb3b3; }

.issue { margin-bottom:15px; }

.issue-title { font-size:22px; font-weight:bold; }

.date { color:#aaa; font-size:14px; }

.memo { margin-top:10px; color:#bbb; }

.article { background:#2b2b2b; padding:8px; margin-top:5px; border-radius:10px; }

.topbar { display:flex; gap:10px; margin-bottom:15px; }

.search { flex:1; }

</style>
</head>

<body>

<div class="container">
<h1>뮤직 아카이브</h1>
<p class="sub">Firebase 기반 음악 DB</p>

<div class="layout">

<!-- 입력 -->
<div class="card">
<h3>음악 추가</h3>

<input id="issue" placeholder="제목"/>
<input id="date" placeholder="가수"/>
<textarea id="articles" placeholder="정보 (줄바꿈)"></textarea>
<textarea id="memo" placeholder="메모"></textarea>

<button class="save-btn" onclick="saveIssue()">저장</button>
</div>

<!-- 리스트 -->
<div>

<div class="card topbar">
<input id="search" class="search" placeholder="검색" oninput="render()"/>
<button class="secondary" onclick="loadFirebase()">새로고침</button>
</div>

<div id="list"></div>

</div>

</div>
</div>

<script type="module">

// ============================
// 🔥 FIREBASE SETUP
// ============================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 👉 여기에 본인 Firebase 설정 넣기
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "XXXX",
appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ============================
// DATA
// ============================

let archive = [];
let editingId = null;

// ============================
// LOAD
// ============================

async function loadFirebase() {
const snap = await getDocs(collection(db, "musicArchive"));
archive = [];

snap.forEach(d => {
archive.push({ id: d.id, ...d.data() });
});

render();
}

window.loadFirebase = loadFirebase;

// ============================
// SAVE / UPDATE
// ============================

async function saveIssue() {

const issue = document.getElementById("issue").value.trim();
const date = document.getElementById("date").value.trim();
const articles = document.getElementById("articles").value.trim();
const memo = document.getElementById("memo").value.trim();

if (!issue || !date) {
alert("제목과 가수는 필수!");
return;
}

const data = {
issue,
date,
articles: articles.split("\n").filter(Boolean),
memo
};

if (editingId) {
await updateDoc(doc(db, "musicArchive", editingId), data);
editingId = null;
} else {
await addDoc(collection(db, "musicArchive"), data);
}

clearForm();
await loadFirebase();
}

window.saveIssue = saveIssue;

// ============================
// DELETE
// ============================

async function remove(id) {
if (!confirm("삭제할까요?")) return;
await deleteDoc(doc(db, "musicArchive", id));
await loadFirebase();
}

window.remove = remove;

// ============================
// EDIT
// ============================

function edit(id) {
const item = archive.find(a => a.id === id);
if (!item) return;

document.getElementById("issue").value = item.issue;
document.getElementById("date").value = item.date;
document.getElementById("articles").value = (item.articles || []).join("\n");
document.getElementById("memo").value = item.memo;

editingId = id;
}

window.edit = edit;

// ============================
// RENDER
// ============================

function render() {

const keyword = document.getElementById("search").value.toLowerCase();
const list = document.getElementById("list");

const filtered = archive.filter(a =>
a.issue.toLowerCase().includes(keyword) ||
a.date.toLowerCase().includes(keyword) ||
(a.memo || "").toLowerCase().includes(keyword)
);

if (filtered.length === 0) {
list.innerHTML = `<div class="card">데이터 없음</div>`;
return;
}

list.innerHTML = filtered.map(item => `
<div class="card issue">

<div class="issue-title">${item.issue}</div>
<div class="date">${item.date}</div>

<div>
${(item.articles || []).map(t => `<div class="article">${t}</div>`).join("")}
</div>

${item.memo ? `<div class="memo">${item.memo}</div>` : ""}

<div style="margin-top:10px; display:flex; gap:10px;">
<button class="secondary" onclick="edit('${item.id}')">수정</button>
<button class="delete-btn" onclick="remove('${item.id}')">삭제</button>
</div>

</div>
`).join("");
}

window.render = render;

// ============================
// CLEAR
// ============================

function clearForm() {
document.getElementById("issue").value = "";
document.getElementById("date").value = "";
document.getElementById("articles").value = "";
document.getElementById("memo").value = "";
}

// ============================
// START
// ============================

loadFirebase();

</script>

</body>
</html>
